<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout · Field Supply</title>
  <link rel="stylesheet" href="style.css">
  <script src="checkout.js" defer></script>
</head>
<body>
  <main>
    <header>
      <p class="brand">Field Supply</p>
      <h1>Checkout</h1>
      <p id="build"></p>
    </header>
    <section aria-labelledby="summary">
      <h2 id="summary">Order summary</h2>
      <dl>
        <div><dt>Canvas Day Bag × 1</dt><dd>$50.00</dd></div>
        <div><dt>Shipping</dt><dd>$5.00</dd></div>
        <div><dt>Discount</dt><dd><output id="discount">$0.00</output></dd></div>
        <div class="total"><dt>Total</dt><dd><output id="total">$55.00</output></dd></div>
      </dl>
    </section>
    <form id="promo">
      <label for="code">Discount code</label>
      <div class="controls">
        <input id="code" autocomplete="off" spellcheck="false">
        <button>Apply code</button>
      </div>
      <p id="promo-message" role="status"></p>
    </form>
    <button id="place" class="primary">Place demo order</button>
    <p id="confirmation" role="status"></p>
    <p class="note">Simulation only. No payment or personal details required.</p>
  </main>
</body>
</html>
